<header class="topbar">
  <div class="topbar__breadcrumb">
    {{ breadcrumb() }}
  </div>

  <div class="topbar__actions">
    <div class="topbar__search">
      <svg lucideSearch [size]="13"></svg>

      <input type="search" placeholder="Buscar professores, informações..." aria-label="Buscar" />
    </div>

    <button class="topbar__notification" type="button" aria-label="Notificações">
      <svg lucideBell [size]="14"></svg>
    </button>
  </div>
</header>
