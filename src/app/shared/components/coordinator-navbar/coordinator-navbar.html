<aside class="navbar">

  <div class="navbar__header">

    <a class="navbar__brand" routerLink="/coordinator">
      <img src="assets/mainlogo.svg" alt="GINI" />
    </a>

    <span class="navbar__role">
      Coordenador
    </span>

  </div>


  <nav class="navbar__menu">

    <a class="navbar__item" routerLink="/coordinator" routerLinkActive="navbar__item--active"
      [routerLinkActiveOptions]="{ exact: true }">
      <svg lucideHome [size]="16"></svg>

      <span>Início</span>
    </a>


    <a class="navbar__item" routerLink="/coordinator/teachers" routerLinkActive="navbar__item--active">
      <svg lucideCalendarDays [size]="16"></svg>

      <span>Disponibilidade</span>
    </a>


    <a class="navbar__item" routerLink="/coordinator/spaces" routerLinkActive="navbar__item--active">
      <svg lucideMapPin [size]="16"></svg>

      <span>Espaços</span>
    </a>

  </nav>


  <div class="navbar__bottom">

    <a class="navbar__item" href="#">
      <svg lucideLogOut [size]="16"></svg>

      <span>Sair</span>
    </a>

    <a class="navbar__item" href="#">
      <svg lucideSettings [size]="16"></svg>

      <span>Ajustes</span>
    </a>

  </div>

</aside>
