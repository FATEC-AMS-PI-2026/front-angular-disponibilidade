<div class="password-reset-page">

  <section class="password-reset-card">
    <div class="password-reset-heading">

      <div class="password-reset-icon">
        <svg lucideKeyRound [size]="32"></svg>
      </div>

      <h1>Redefinir senha</h1>

      <p class="password-reset-subtitle">
        Informe o e-mail da sua conta e enviaremos um link para criar uma nova senha
      </p>

      <div class="input-group">
        <label for="email">
          E-mail
        </label>
        <input id="email" type="email" placeholder="E-mail" />
      </div>

      <button class="password-reset-button action-button action-button--primary" type="button">
        Enviar link
      </button>

      <a class="password-reset-back" routerLink="/profile-select">
        Voltar para escolha de perfil
      </a>
    </div>
  </section>

  <div class="password-reset-banner">
    <img ngSrc="assets/buildingimage.jpg" alt="Building" width="474" height="316" />
  </div>

</div>
