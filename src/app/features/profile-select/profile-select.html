<div class="profile-select-page">

  <div class="profile-select-banner">
    <img ngSrc="assets/buildingimage.jpg" alt="Building" width="474" height="316" />
  </div>

  <section class="profile-select-card">
    <div class="profile-select-heading">

      <div class="profile-select-icon">
        <svg lucideLogIn [size]="32"></svg>
      </div>

      <h1>Escolha seu perfil</h1>

      <button class="profile-button" type="button" routerLink="/professor/login">
        <div class="button-content">
          <svg lucideUser [size]="28"></svg>
          <span>Sou Professor</span>
        </div>

        <svg lucideChevronRight class="arrow" [size]="20">
        </svg>
      </button>

      <button class="profile-button" type="button" routerLink="/coordinator/login">
        <div class="button-content">
          <svg lucideUserShield [size]="28"></svg>
          <span>Sou Coordenador</span>
        </div>

        <svg lucideChevronRight class="arrow" [size]="20">
        </svg>
      </button>

    </div>
  </section>
</div>
